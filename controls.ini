; Tokyo Jungle PC controls.
; Change them in game with F1, with scripts/controls_editor.ps1, or by hand.
; Changes apply while the game is running (within a second).
;
; [keyboard]  action = Key, Key, Key   (up to 3 keys; leave empty to unbind)
;   Key names: A-Z, 0-9, F3-F24 (F1/F2 reserved), Space, Enter, Backspace, Tab, Escape, CapsLock,
;   Shift, LShift, RShift, Ctrl, LCtrl, RCtrl, Alt, LAlt, RAlt, Up, Down, Left, Right,
;   Insert, Delete, Home, End, PageUp, PageDown, Numpad0-Numpad9, NumpadMultiply,
;   NumpadAdd, NumpadSubtract, NumpadDecimal, NumpadDivide, Semicolon, Equals, Comma,
;   Minus, Period, Slash, Backtick, LeftBracket, Backslash, RightBracket, Quote,
;   MouseLeft, MouseRight, MouseMiddle, Mouse4, Mouse5
;
; [controller]  action = Button   (Xbox/XInput; None to unbind)
;   Buttons: A, B, X, Y, LB, RB, LT, RT, LS, RS, Start, Back,
;   DpadUp, DpadDown, DpadLeft, DpadRight

[keyboard]
cross = Space, Z
circle = F
square = E
triangle = V
l1 = LCtrl
r1 = LShift
l2 = 1
r2 = 3
l3 =
r3 = CapsLock
start = Enter
select = Backspace
up = Numpad8
down = Numpad2
left = Numpad4
right = Numpad6
lstick_up = W
lstick_down = S
lstick_left = A
lstick_right = D
rstick_up = Up
rstick_down = Down
rstick_left = Left
rstick_right = Right

[controller]
cross = A
circle = B
square = X
triangle = Y
l1 = LB
r1 = RB
l2 = LT
r2 = RT
l3 = LS
r3 = RS
start = Start
select = Back
up = DpadUp
down = DpadDown
left = DpadLeft
right = DpadRight
